services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-dev-password}
      APP_TOKEN: ${APP_TOKEN:-dev-token}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: "8080"
    restart: unless-stopped
