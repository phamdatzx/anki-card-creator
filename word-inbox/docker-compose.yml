# Local S3 for development. Frontend and backend run on the host.
services:
  s3:
    image: gresau/localstack-persist:4
    ports:
      - "${S3_PORT:-4567}:4566"
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET:-word-inbox-local}
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - s3-data:/persisted-data
    restart: unless-stopped

volumes:
  s3-data:
