services:
  app:
    build:
      context: ..
      dockerfile: word-inbox/Dockerfile
    env_file: .env
    ports:
      # Bound to localhost: put a TLS reverse proxy (Caddy, nginx) in front.
      - "127.0.0.1:${PORT:-8088}:8088"
    volumes:
      # collection.anki2, its media, the cached AnkiWeb key, the app secret.
      - ./data:/data
    restart: unless-stopped
