name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python (add-on + server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: word-inbox/server/requirements*.txt
      - run: pip install -r word-inbox/server/requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
      - run: python -m compileall -q anki_card_creator word-inbox/server
      - run: ./package.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: word-inbox/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: word-inbox/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
